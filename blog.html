<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blog de Alerrandro - Artigos sobre Linux, Seguranca, Hardware, Desenvolvimento e tecnologia.">
  <meta name="author" content="Alerrandro">
  <meta name="theme-color" content="#050505">
  <title>Blog | Alerrandro</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23050505'/><text y='24' x='4' font-size='22' fill='%2300ff41' font-family='monospace'>_</text></svg>">
</head>
<body>
  <canvas id="matrix-canvas"></canvas>
  <div id="site-nav"></div>
  <div id="site-hud"></div>

  <div class="site-wrapper">

    <div class="page-hero">
      <div class="container">
        <div class="page-hero-label animate-in">$ cat /var/log/blog.log</div>
        <h1 class="page-hero-title animate-in delay-1">
          <span class="accent">Blog</span> &amp; Artigos
        </h1>
        <p class="page-hero-desc animate-in delay-2">
          Documentacao de experimentos, estudos e descobertas em Linux, seguranca da informacao, hardware, desenvolvimento e tecnologia em geral.
        </p>
      </div>
    </div>

    <section class="section-padding">
      <div class="container">

        <div class="blog-controls animate-in">
          <div class="search-wrapper">
            <span class="search-prefix">grep -r</span>
            <input
              type="text"
              class="search-input"
              id="search-input"
              placeholder="buscar artigos..."
              autocomplete="off"
              spellcheck="false"
            >
          </div>
          <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">Todos</button>
            <button class="filter-btn" data-filter="linux">Linux</button>
            <button class="filter-btn" data-filter="security">Seguranca</button>
            <button class="filter-btn" data-filter="dev">Dev</button>
            <button class="filter-btn" data-filter="hardware">Hardware</button>
          </div>
        </div>

        <div class="posts-grid" id="posts-container"></div>

      </div>
    </section>

  </div>

  <div id="site-footer"></div>

  <script src="assets/js/components.js"></script>
  <script src="assets/js/matrix.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/posts.js"></script>
</body>
</html>
